[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-intel-ml"
version = "0.1.0"
description = "Production-style customer churn ML project for resume impact"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "streamlit>=1.36.0",
    "xgboost>=2.1.0",
    "shap>=0.46.0",
    "python-multipart>=0.0.9",
    "PyJWT>=2.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["ml", "backend", "src"]
testpaths = ["tests"]

